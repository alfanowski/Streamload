name: build-and-deploy

# On a SemVer tag push (v0.0.1, v1.2.3, ...):
#   1. build-push  — build the image and push it to GHCR
#   2. deploy      — SSH to the VPS and roll the stack to the new tag
#
# Cutting a tag is the single "ship to prod" action. workflow_dispatch is kept
# so you can re-run a build from the Actions UI (it skips deploy unless a tag).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/alfanowski/streamload-api

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    # Only deploy for real tag releases, after the image is on GHCR.
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The pushed tag, e.g. v0.0.3. Pin it so the VPS runs exactly the
          # released version (not whatever :latest happens to be).
          envs: GITHUB_REF_NAME
          script: |
            set -e
            cd /opt/streamload
            # Pin .env.prod to the freshly released tag.
            sed -i "s/^API_TAG=.*/API_TAG=${GITHUB_REF_NAME}/" .env.prod
            echo "[deploy] rolling to API_TAG=${GITHUB_REF_NAME}"
            docker compose pull api
            docker compose up -d
            # Wait for the api container to report healthy (max ~90s).
            for i in $(seq 1 18); do
              status=$(docker inspect -f '{{.State.Health.Status}}' streamload-api 2>/dev/null || echo "starting")
              echo "[deploy] api health: $status"
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            docker compose ps
            # Prune old dangling images to keep the 70GB disk tidy.
            docker image prune -f >/dev/null 2>&1 || true
