name: build-and-push

# Build the production image and push it to GHCR. Triggers ONLY on a SemVer
# tag push (v0.0.1, v1.2.3, ...) -- not on every commit to main. Cutting a
# release tag is the explicit "ship this" signal.
#
# This workflow does NOT deploy to the VPS. The operator pulls the new image
# manually (see docs/DEPLOY.md / docs/OPENCODE_PROMPTS.md):
#   API_TAG=v0.0.1 docker compose pull && API_TAG=v0.0.1 docker compose up -d
# or just `docker compose pull && docker compose up -d` to take :latest.
#
# Image tags produced for tag v0.0.1: v0.0.1 / 0.0.1 / 0.0 / latest.
#
# workflow_dispatch is kept so you can rebuild from the Actions UI without
# cutting a new tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/alfanowski/streamload-api

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
