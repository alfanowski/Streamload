# Streamload v3 production stack (DigitalOcean Debian 13 droplet).
#
# Three services:
#   db    -> Postgres 16 (alpine), internal-only, named volume for data
#   api   -> this backend, pulled from GHCR, reachable only on the compose net
#   caddy -> reverse proxy + automatic HTTPS (Let's Encrypt) for api.capytal.tech
#
# Secrets / config come from .env.prod (created on the VPS, NEVER committed).
# See .env.prod.example for the full list of required variables.
#
# The image is built + pushed to GHCR by .github/workflows/deploy.yml on push to
# main. The VPS only pulls:  docker compose pull && docker compose up -d

x-restart-policy: &restart unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: streamload-db
    restart: *restart
    # POSTGRES_* are read from .env.prod via env_file.
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # NOT published to the host: only the api service reaches it on the compose
    # network at host "db", port 5432.

  api:
    image: ghcr.io/alfanowski/streamload-api:${API_TAG:-latest}
    container_name: streamload-api
    restart: *restart
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    # No host port publish — Caddy proxies to api:8000 on the compose network.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: streamload-caddy
    restart: *restart
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued TLS certs + ACME account (persist!)
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Nightly pg_dump backups are written by deploy/backup.sh to a HOST directory
# (/opt/streamload/backups) via `docker compose exec`, so no extra bind mount is
# needed here. See docs/DEPLOY.md for the cron setup.
